<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Figma Export — Login</title>
  <link rel="stylesheet" href="../shared.css" />
  <style>
    body { background: #f4f7fb; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .auth-card {
      width: 100%; max-width: 440px; background: #fff; border: 1px solid #dbe3ef;
      border-radius: 16px; box-shadow: 0 20px 45px rgba(15,23,42,0.08); padding: 32px;
    }
    .brand { font-size: 14px; font-weight: 600; color: #2563eb; letter-spacing: 0.04em; text-transform: uppercase; }
    .auth-card h1 { font-size: 28px; margin: 8px 0 0; }
    .subtitle { color: #64748b; margin-top: 8px; font-size: 14px; }
    .form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
    input {
      padding: 12px 14px; border: 1px solid #dbe3ef; border-radius: 8px; font-size: 16px;
    }
    .btn-full { width: 100%; text-align: center; padding: 12px; margin-top: 8px; }
    .footer { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
    .footer a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="frame" data-screen="Login" style="background:#f4f7fb;min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div class="auth-card">
      <p class="brand">Driver Education</p>
      <h1>Sign in</h1>
      <p class="subtitle">Welcome back. Continue your DMV study.</p>
      <form class="form">
        <label>Email<input type="email" value="student@example.com" /></label>
        <label>Password<input type="password" value="••••••••" /></label>
        <button type="button" class="btn btn-primary btn-full">Sign in</button>
      </form>
      <p class="footer">Don't have an account? <a href="#">Create one</a></p>
    </div>
  </div>
</body>
</html>
