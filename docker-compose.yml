services:
  db:
    image: postgres:16
    container_name: driver-ed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: driver_education
    ports:
      - "5432:5432"
    volumes:
      - driver_ed_pgdata:/var/lib/postgresql/data

volumes:
  driver_ed_pgdata:
